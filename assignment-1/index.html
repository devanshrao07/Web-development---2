<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="style.cssgit push -u">
</head>

<body>

    <header>
        <h1>🎯 Smart Event Dashboard</h1>
    </header>

    <div class="container">
        <!-- User Input Section -->
        <section class="card input-section">
            <h2>Add New Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Event Title:</label>
                    <input type="text" id="eventTitle" placeholder="Enter event title..." required>
                </div>

                <div class="form-group">
                    <label for="eventDate">Event Date:</label>
                    <input type="date" id="eventDate" required>
                </div>

                <div class="form-group">
                    <label for="eventCategory">Category:</label>
                    <select id="eventCategory">
                        <option value="Conference">Conference</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Meeting">Meeting</option>
                        <option value="Party">Party</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description:</label>
                    <textarea id="eventDescription" rows="3" placeholder="Enter details..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Add Event</button>
            </form>
        </section>

        <!-- Events Display Section -->
        <section class="card display-section">
            <h2>My Events</h2>
            <div class="button-group">
                <button id="clearBtn" class="btn-secondary">Clear All Events</button>
                <button id="sampleBtn" class="btn-secondary">Add Sample Events</button>
            </div>

            <div id="eventsContainer" class="events-list">
                <p class="empty-state">No events yet. Add your first event!</p>
            </div>
        </section>
    </div>

    <!-- DOM Interaction Demo Section -->
    <div class="container">
        <section class="card demo-section">
            <h2>DOM Manipulation Demo</h2>
            <div class="display-box">
                <strong>You Pressed:</strong> <span id="pressedKey">None</span>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
